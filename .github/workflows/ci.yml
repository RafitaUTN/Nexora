name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, smoke y build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Smoke tests
        run: npm run smoke

      - name: Build desktop
        run: npm run build -w apps/desktop

      - name: Verify build output
        run: |
          test -f apps/desktop/out/main/index.js
          test -f apps/desktop/out/preload/index.cjs
          test -f apps/desktop/out/renderer/index.html
